          cat > SilentTouch/app/src/main/java/com/silenttouch/app/data/bluetooth/BluetoothManager.kt << 'KT12'
          package com.silenttouch.app.data.bluetooth
          import android.bluetooth.BluetoothAdapter
          import android.bluetooth.BluetoothDevice
          import android.bluetooth.BluetoothServerSocket
          import android.bluetooth.BluetoothSocket
          import android.content.Context
          import android.os.PowerManager
          import kotlinx.coroutines.*
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import java.io.IOException
          import java.util.UUID
          class BluetoothManager(private val context: Context) {
              companion object { private val MY_UUID: UUID = UUID.fromString("00001101-0000-1000-8000-00805F9B34FB"); private const val CONNECTION_TIMEOUT_MS = 5000L }
              private val bluetoothAdapter: BluetoothAdapter? = BluetoothAdapter.getDefaultAdapter()
              private val _connectionState = MutableStateFlow<ConnectionState>(ConnectionState.Disconnected)
              val connectionState: StateFlow<ConnectionState> = _connectionState.asStateFlow()
              private var serverSocket: BluetoothServerSocket? = null
              private var connectedSocket: BluetoothSocket? = null
              private var inputStream: java.io.InputStream? = null
              private var outputStream: java.io.OutputStream? = null
              private val ioScope = CoroutineScope(Dispatchers.IO + SupervisorJob())
              private var acceptJob: Job? = null; private var connectJob: Job? = null; private var readJob: Job? = null
              private var targetDevice: BluetoothDevice? = null; private var listener: Listener? = null
              private var wakelock: PowerManager.WakeLock? = null
              interface Listener { fun onButtonReceived(buttonId: Int); fun onAckReceived(); fun onConnectionLost() }
              fun setListener(listener: Listener?) { this.listener = listener }
              fun setTargetDevice(device: BluetoothDevice) { targetDevice = device }
              fun start() {
                  if (bluetoothAdapter == null || !bluetoothAdapter.isEnabled) { _connectionState.value = ConnectionState.Error("Bluetooth off"); return }
                  wakelock = (context.getSystemService(Context.POWER_SERVICE) as PowerManager).newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "SilentTouch:BT").apply { acquire() }
                  startServer(); startClientIfNeeded()
              }
              fun stop() { disconnect(); wakelock?.let { if (it.isHeld) it.release() }; wakelock = null }
              private fun startServer() { acceptJob = ioScope.launch { try { serverSocket = bluetoothAdapter?.listenUsingRfcommWithServiceRecord("SilentTouch", MY_UUID); while (isActive) { val socket = serverSocket?.accept(); socket?.let { if (connectedSocket == null) { connectToSocket(it, it.remoteDevice.name ?: "Unknown"); cancelClientAttempt() } else it.close() } } } catch (e: IOException) {} } }
              private fun startClientIfNeeded() { targetDevice?.let { device -> connectJob = ioScope.launch { try { _connectionState.value = ConnectionState.Connecting; val socket = withTimeoutOrNull(CONNECTION_TIMEOUT_MS) { device.createRfcommSocketToServiceRecord(MY_UUID).apply { connect() } }; if (socket != null && isActive) connectToSocket(socket, device.name ?: "Unknown") else _connectionState.value = ConnectionState.Error("Connection timeout") } catch (e: IOException) { _connectionState.value = ConnectionState.Error("Connection failed") } } } }
              private fun connectToSocket(socket: BluetoothSocket, deviceName: String) { disconnectSocket(); connectedSocket = socket; inputStream = socket.inputStream; outputStream = socket.outputStream; _connectionState.value = ConnectionState.Connected(deviceName); startReading(); serverSocket?.close(); serverSocket = null }
              private fun startReading() { readJob = ioScope.launch { try { val buffer = ByteArray(1); while (isActive) { val bytesRead = inputStream?.read(buffer) ?: -1; if (bytesRead == -1) throw IOException("Stream ended"); val byte = buffer[0]; if (byte == BluetoothPacket.ACK) withContext(Dispatchers.Main) { listener?.onAckReceived() } else if (BluetoothPacket.isButtonCode(byte)) { withContext(Dispatchers.Main) { listener?.onButtonReceived(byte.toInt()) }; sendAck() } } } catch (e: IOException) { withContext(Dispatchers.Main) { _connectionState.value = ConnectionState.Disconnected; listener?.onConnectionLost() } } } }
              private fun sendAck() { ioScope.launch { try { outputStream?.write(BluetoothPacket.ACK.toInt()); outputStream?.flush() } catch (_: Exception) {} } }
              fun sendButtonSignal(buttonId: Int) { if (outputStream == null) return; ioScope.launch { try { outputStream?.write(buttonId); outputStream?.flush() } catch (_: IOException) {} } }
              private fun cancelClientAttempt() { connectJob?.cancel() }
              fun disconnect() { ioScope.coroutineContext.cancelChildren(); disconnectSocket(); serverSocket?.close(); serverSocket = null; _connectionState.value = ConnectionState.Disconnected }
              private fun disconnectSocket() { try { connectedSocket?.close() } catch (_: Exception) {}; connectedSocket = null; inputStream = null; outputStream = null }
          }
