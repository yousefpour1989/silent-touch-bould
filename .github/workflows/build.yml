          package com.silenttouch.app.ui.viewmodel
          import android.app.Application
          import android.bluetooth.BluetoothAdapter
          import android.bluetooth.BluetoothDevice
          import android.os.Build
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import com.silenttouch.app.data.bluetooth.BluetoothManager
          import com.silenttouch.app.data.bluetooth.ConnectionState
          import com.silenttouch.app.data.local.PreferencesManager
          import com.silenttouch.app.data.model.ButtonConfig
          import com.silenttouch.app.data.model.VibrationPattern
          import kotlinx.coroutines.flow.*
          import kotlinx.coroutines.launch
          class MainViewModel(application: Application) : AndroidViewModel(application) {
              private val prefs = PreferencesManager(application)
              private val bluetoothManager = BluetoothManager(application)
              val connectionState: StateFlow<ConnectionState> = bluetoothManager.connectionState
              val deliveryConfirmation: StateFlow<Boolean> = prefs.deliveryConfirmation.stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), false)
              val buttonConfigs: StateFlow<List<ButtonConfig>> = prefs.loadButtonConfigs().stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())
              private val vibrator: Vibrator = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                  (application.getSystemService(VibratorManager::class.java)).defaultVibrator
              } else { @Suppress("DEPRECATION") application.getSystemService(android.content.Context.VIBRATOR_SERVICE) as Vibrator }
              private val _showVibrationEditor = MutableStateFlow<ButtonConfig?>(null)
              val showVibrationEditor: StateFlow<ButtonConfig?> = _showVibrationEditor.asStateFlow()
              init {
                  bluetoothManager.setListener(object : BluetoothManager.Listener {
                      override fun onButtonReceived(buttonId: Int) { buttonConfigs.value.find { it.id == buttonId }?.let { playVibration(it.vibrationPattern) } }
                      override fun onAckReceived() { if (deliveryConfirmation.value) playVibration(VibrationPattern(listOf(com.silenttouch.app.data.model.VibrationSegment(50, true)))) }
                      override fun onConnectionLost() {
                          bluetoothManager.stop()
                          viewModelScope.launch {
                              prefs.targetDeviceAddress.collectLatest { addr ->
                                  if (addr != null) {
                                      val device = BluetoothAdapter.getDefaultAdapter()?.getRemoteDevice(addr)
                                      if (device != null) { bluetoothManager.setTargetDevice(device); bluetoothManager.start() }
                                  }
                              }
                          }
                      }
                  })
              }
              fun onPermissionsGranted() {
                  viewModelScope.launch {
                      prefs.targetDeviceAddress.collectLatest { addr ->
                          if (addr != null) {
                              val device = BluetoothAdapter.getDefaultAdapter()?.getRemoteDevice(addr)
                              if (device != null) { bluetoothManager.setTargetDevice(device); bluetoothManager.start() }
                          }
                      }
                  }
              }
              fun connectToDevice(device: BluetoothDevice) { viewModelScope.launch { prefs.setTargetDeviceAddress(device.address); bluetoothManager.setTargetDevice(device); bluetoothManager.start() } }
              fun disconnect() { bluetoothManager.stop() }
              fun sendSignal(buttonId: Int) { bluetoothManager.sendButtonSignal(buttonId) }
              fun setDeliveryConfirmation(enabled: Boolean) { viewModelScope.launch { prefs.setDeliveryConfirmation(enabled) } }
              fun openVibrationEditor(config: ButtonConfig) { _showVibrationEditor.value = config }
              fun closeVibrationEditor() { _showVibrationEditor.value = null }
              fun saveButtonConfig(buttonId: Int, label: String, pattern: VibrationPattern) { viewModelScope.launch { prefs.saveButtonConfig(buttonId, label, pattern) } }
              private fun playVibration(pattern: VibrationPattern) {
                  val (timings, amplitudes) = pattern.toTimingsAndAmplitudes()
                  if (timings.isEmpty()) return
                  vibrator.vibrate(VibrationEffect.createWaveform(timings, amplitudes, if (pattern.repeat) 0 else -1))
              }
              override fun onCleared() { super.onCleared(); bluetoothManager.stop() }
