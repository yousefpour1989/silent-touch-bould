          cat > SilentTouch/app/src/main/java/com/silenttouch/app/data/model/VibrationPattern.kt << 'KT6'
          package com.silenttouch.app.data.model
          data class VibrationPattern(val segments: List<VibrationSegment>, val repeat: Boolean = false) {
              fun toTimingsAndAmplitudes(): Pair<LongArray, IntArray> {
                  val timings = mutableListOf<Long>()
                  val amplitudes = mutableListOf<Int>()
                  for (seg in segments) { timings.add(seg.duration); amplitudes.add(if (seg.isVibrate) 255 else 0) }
                  return timings.toLongArray() to amplitudes.toIntArray()
              }
              companion object {
                  val DEFAULT_SHORT = VibrationPattern(listOf(VibrationSegment(200, true)))
                  val DEFAULT_LONG = VibrationPattern(listOf(VibrationSegment(600, true)))
                  val DEFAULT_EMERGENCY = VibrationPattern(listOf(
                      VibrationSegment(300, true), VibrationSegment(100, false),
                      VibrationSegment(300, true), VibrationSegment(100, false),
                      VibrationSegment(300, true)), repeat = true)
              }
          }
          data class VibrationSegment(val duration: Long, val isVibrate: Boolean)
