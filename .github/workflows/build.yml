          package com.silenttouch.app.data.local
          import android.content.Context
          import androidx.datastore.core.DataStore
          import androidx.datastore.preferences.core.*
          import androidx.datastore.preferences.preferencesDataStore
          import com.silenttouch.app.data.model.ButtonConfig
          import com.silenttouch.app.data.model.VibrationPattern
          import com.silenttouch.app.util.VibrationPatternSerializer
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.map
          private val Context.dataStore: DataStore<Preferences> by preferencesDataStore(name = "settings")
          class PreferencesManager(private val context: Context) {
              companion object {
                  private val KEY_TARGET_DEVICE_ADDRESS = stringPreferencesKey("target_device_address")
                  private val KEY_DELIVERY_CONFIRMATION = booleanPreferencesKey("delivery_confirmation")
              }
              val targetDeviceAddress: Flow<String?> = context.dataStore.data.map { it[KEY_TARGET_DEVICE_ADDRESS] }
              val deliveryConfirmation: Flow<Boolean> = context.dataStore.data.map { it[KEY_DELIVERY_CONFIRMATION] ?: false }
              suspend fun setTargetDeviceAddress(address: String) { context.dataStore.edit { it[KEY_TARGET_DEVICE_ADDRESS] = address } }
              suspend fun setDeliveryConfirmation(enabled: Boolean) { context.dataStore.edit { it[KEY_DELIVERY_CONFIRMATION] = enabled } }
              suspend fun saveButtonConfig(id: Int, label: String, pattern: VibrationPattern) {
                  context.dataStore.edit { prefs ->
                      prefs[stringPreferencesKey("btn_label_$id")] = label
                      prefs[stringPreferencesKey("btn_pattern_$id")] = VibrationPatternSerializer.serialize(pattern)
                  }
              }
              fun loadButtonConfigs(): Flow<List<ButtonConfig>> {
                  return context.dataStore.data.map { prefs ->
                      (0..9).map { id ->
                          val label = prefs[stringPreferencesKey("btn_label_$id")] ?: getDefaultLabel(id)
                          val patternStr = prefs[stringPreferencesKey("btn_pattern_$id")]
                          val pattern = if (patternStr != null) VibrationPatternSerializer.deserialize(patternStr) else getDefaultPattern(id)
                          ButtonConfig(id, label, pattern)
                      }
                  }
              }
              private fun getDefaultLabel(id: Int): String = when(id) {
                  0 -> "Look at me"; 1 -> "Yes"; 2 -> "No"; 3 -> "Come here"; 4 -> "OK"; 5 -> "Emergency"
                  6 -> "Custom 1"; 7 -> "Custom 2"; 8 -> "Custom 3"; 9 -> "Custom 4"; else -> "Btn $id"
              }
              private fun getDefaultPattern(id: Int): VibrationPattern = if (id == 5) VibrationPattern.DEFAULT_EMERGENCY else VibrationPattern.DEFAULT_SHORT
          }
