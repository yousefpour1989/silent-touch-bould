      - name: Setup Gradle wrapper
        run: cd SilentTouch && gradle wrapper --gradle-version 8.5

      - name: Build APK
        run: cd SilentTouch && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SilentTouch-debug
          path: SilentTouch/app/build/outputs/apk/debug/app-debug.apk
