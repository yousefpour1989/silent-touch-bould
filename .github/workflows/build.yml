          cat > SilentTouch/app/src/main/java/com/silenttouch/app/util/VibrationPatternSerializer.kt << 'KT11'
          package com.silenttouch.app.util
          import com.silenttouch.app.data.model.VibrationPattern
          import com.silenttouch.app.data.model.VibrationSegment
          object VibrationPatternSerializer {
              fun serialize(pattern: VibrationPattern): String {
                  val segs = pattern.segments.joinToString(";") { "${it.duration},${if (it.isVibrate) 1 else 0}" }
                  return "$segs|${if (pattern.repeat) 1 else 0}"
              }
              fun deserialize(str: String): VibrationPattern {
                  val parts = str.split("|")
                  val segments = if (parts[0].isNotEmpty()) {
                      parts[0].split(";").map { val pair = it.split(","); VibrationSegment(pair[0].toLong(), pair[1] == "1") }
                  } else emptyList()
                  val repeat = parts.getOrElse(1) { "0" } == "1"
                  return VibrationPattern(segments, repeat)
              }
          }
