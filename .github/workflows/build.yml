              if (showSettings) AlertDialog(
                  onDismissRequest = { showSettings = false }, title = { Text("Settings") },
                  text = { Column {
                      Row(verticalAlignment = Alignment.CenterVertically) { Checkbox(checked = deliveryConfirmation, onCheckedChange = { viewModel.setDeliveryConfirmation(it) }); Text("Delivery confirmation vibration") }
                      Button(onClick = { viewModel.disconnect(); showDevicePicker = true; showSettings = false }) { Text("Change paired device") }
